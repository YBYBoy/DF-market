name: Market screenshot email

on:
  schedule:
    # Re-register the scheduler and avoid the top-of-hour load window.
    - cron: "9,29,49 * * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-screenshot-email
  cancel-in-progress: false

jobs:
  capture-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Chinese fonts and browser driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check selenium
          fc-cache -f

      - name: Capture pages and send email
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python3 monitor.py
